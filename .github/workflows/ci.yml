name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET) — build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Compilar
        run: dotnet build backend/AutoFlow.slnx -c Release
      - name: Testes unitários e de integração
        run: dotnet test backend/AutoFlow.slnx -c Release --no-build
      - name: Teste de fumaça (a API sobe e gera o OpenAPI)
        working-directory: backend/src/AutoFlow.Api/bin/Release/net10.0
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
          Banco__InicializarAoSubir: "false"
        run: |
          dotnet AutoFlow.Api.dll &
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost:5080/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:5080/health
          curl -fsS -o openapi.json http://localhost:5080/openapi/v1.json
          grep -q '/api/auth/login' openapi.json

  admin:
    name: Painel (React) — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  mobile:
    name: App (.NET MAUI) — build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Instalar workload MAUI (Android)
        run: dotnet workload install maui-android
      - name: Compilar para Android
        run: dotnet build mobile/AutoFlow.Mobile/AutoFlow.Mobile.csproj -f net10.0-android -c Debug
