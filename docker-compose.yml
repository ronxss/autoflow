# Ambiente de desenvolvimento: SQL Server + API.
#   docker compose up -d sqlserver        -> só o banco (API rodando com "dotnet run")
#   docker compose up -d --build          -> banco + API em http://localhost:5080
# As senhas e chaves abaixo são apenas para desenvolvimento local.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AutoFlow@Dev123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-dados:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Padrao: "Server=sqlserver,1433;Database=AutoFlow;User Id=sa;Password=AutoFlow@Dev123;TrustServerCertificate=True"
    ports:
      - "5080:8080"

volumes:
  sqlserver-dados:
